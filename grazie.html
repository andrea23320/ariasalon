  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      background:#050505;color:#F8F6F2;
      min-height:100svh;display:flex;align-items:center;justify-content:center;
      padding:2rem 5%;text-align:center;position:relative;overflow:hidden;isolation:isolate;
    }
    body::before{
      content:'';position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:min(720px,95%);height:min(720px,95%);
      background:radial-gradient(circle,rgba(197,160,89,0.16) 0%,rgba(197,160,89,0.04) 35%,transparent 65%);
      pointer-events:none;z-index:0;
      animation:glow 6s ease-in-out infinite;
    }
    @keyframes glow{
      0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}
      50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    }
    .wrap{position:relative;z-index:2;max-width:640px;width:100%}
    .logo{height:48px;width:auto;margin:0 auto 2rem;display:block;opacity:0.95}
    .check{
      width:72px;height:72px;margin:0 auto 1.5rem;
      border-radius:50%;border:1px solid rgba(197,160,89,0.4);
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle,rgba(197,160,89,0.15) 0%,transparent 70%);
      animation:pop 0.6s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes pop{
      0%{transform:scale(0.6);opacity:0}
      100%{transform:scale(1);opacity:1}
    }
    .check svg{width:32px;height:32px;stroke:#C5A059;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    h1{
      font-family:'Cormorant Garamond',Georgia,serif;
      font-size:clamp(2rem,6vw,3rem);
      font-weight:400;line-height:1.1;margin-bottom:0.85rem;
    }
    h1 em{font-style:italic;color:#C5A059}
    p{
      font-size:0.92rem;line-height:1.65;
      color:rgba(248,246,242,0.72);
      max-width:440px;margin:0 auto 2rem;
    }
    .status{
      display:inline-flex;align-items:center;gap:0.6rem;
      padding:0.65rem 1.15rem;
      border:1px solid rgba(197,160,89,0.3);
      border-radius:999px;
      font-size:0.7rem;letter-spacing:0.14em;
      text-transform:uppercase;font-weight:600;
      color:#C5A059;margin-bottom:2rem;
    }
    .status-dot{
      width:7px;height:7px;border-radius:50%;background:#C5A059;
      animation:pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:0.4;transform:scale(1.4)}
    }
    .btn{
      display:inline-flex;align-items:center;gap:0.75rem;
      background:linear-gradient(135deg,#FFFFFF 0%,#F6F1E5 100%);
      color:#141414;text-decoration:none;
      padding:1rem 1.75rem;border-radius:2px;
      font-size:0.72rem;letter-spacing:0.18em;
      text-transform:uppercase;font-weight:700;
      box-shadow:0 10px 30px rgba(0,0,0,0.5),0 0 0 1px rgba(197,160,89,0.2);
      transition:transform 0.25s ease,box-shadow 0.25s ease;
    }
    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 16px 40px rgba(0,0,0,0.6),0 0 0 1px rgba(197,160,89,0.5);
    }
    .btn span:last-child{transition:transform 0.25s ease}
    .btn:hover span:last-child{transform:translateX(5px)}
    .links{
      margin-top:2.5rem;font-size:0.7rem;
      letter-spacing:0.12em;text-transform:uppercase;
      display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;
    }
    .links a{color:rgba(197,160,89,0.85);text-decoration:none;transition:color 0.2s}
    .links a:hover{color:#F4E2B8}
    .divider{
      display:flex;align-items:center;justify-content:center;
      gap:0.85rem;margin:2rem 0 1.5rem;
    }
    .divider::before,.divider::after{
      content:'';width:32px;height:1px;
      background:linear-gradient(90deg,transparent,rgba(197,160,89,0.6));
    }
    .divider::after{background:linear-gradient(90deg,rgba(197,160,89,0.6),transparent)}
    .divider span{
      color:#C5A059;font-size:0.68rem;
      letter-spacing:0.24em;text-transform:uppercase;font-weight:500;
    }
  </style>
</head>

    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24"><polyline points="5 13 10 18 19 7"/></svg>

    <h1>Grazie, <em>a tra poco.</em></h1>
    <p>Stiamo aprendo WhatsApp con il tuo messaggio già pronto. Se non succede nulla entro qualche secondo, tocca il pulsante qui sotto.</p>

    <div class="status">
      <span class="status-dot"></span>
      <span id="statusLabel">Apertura WhatsApp…</span>
    </div>

    <div class="divider"><span>Atelier · Rho</span></div>

    <a href="#" id="waBtn" class="btn" rel="noopener">
      <span>Apri WhatsApp manualmente</span>
      <span>→</span>
    </a>

    <div class="links">
      <a href="/ariasalon/">Home</a>
      <a href="/ariasalon/#servizi">Servizi</a>
      <a href="/ariasalon/#faq">FAQ</a>
      <a href="tel:+390299760547">Chiama</a>
    </div>
  </div>

  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var to = params.get('to');
      var label = params.get('label') || 'whatsapp-generic';
      var msg = params.get('msg') || '';

      // 1. LOG del click (localStorage, max 200 eventi)
      try {
        var log = JSON.parse(localStorage.getItem('aria_wa_clicks') || '[]');
        log.push({
          ts: Date.now(),
          label: label,
          msg: msg.substring(0, 120),
          ref: document.referrer || 'direct'
        });
        if (log.length > 200) log = log.slice(-200);
        localStorage.setItem('aria_wa_clicks', JSON.stringify(log));
      } catch(e) {}

      // 2. Fallback: se non arriva 'to', mostra solo la pagina di ringraziamento
      var waBtn = document.getElementById('waBtn');
      var statusLabel = document.getElementById('statusLabel');

      if (!to) {
        statusLabel.textContent = 'Nessun link WhatsApp ricevuto';
        waBtn.href = 'https://wa.me/390299760547';
        return;
      }

      // 3. Il link "manuale" è sempre disponibile
      waBtn.href = to;

      // 4. Auto-redirect dopo 1.1s (lascia il tempo di leggere il messaggio)
      var redirected = false;
      function go() {
        if (redirected) return;
        redirected = true;
        window.location.href = to;
      }

      setTimeout(go, 1100);

      // 5. Se l'utente clicca "Apri manualmente", aggiorna lo status
      waBtn.addEventListener('click', function(){
        statusLabel.textContent = 'Reindirizzamento…';
      });

      // 6. Anteprima messaggio (utile in fase di debug)
      if (msg) {
        console.log('[Aria Salon] WhatsApp message:', msg);
      }
    })();
  </script>
