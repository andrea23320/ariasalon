<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Grazie · Aria Salon Rho</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#050505">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Plus Jakarta Sans',system-ui,sans-serif;
      background:#050505;color:#F8F6F2;
      min-height:100svh;display:flex;align-items:center;justify-content:center;
      padding:2rem 5%;text-align:center;position:relative;overflow:hidden;isolation:isolate;
    }
    body::before{
      content:'';position:absolute;top:50%;left:50%;
      transform:translate(-50%,-50%);
      width:min(720px,95%);height:min(720px,95%);
      background:radial-gradient(circle,rgba(197,160,89,0.16) 0%,rgba(197,160,89,0.04) 35%,transparent 65%);
      pointer-events:none;z-index:0;
      animation:glow 6s ease-in-out infinite;
    }
    @keyframes glow{
      0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}
      50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
    }
    .wrap{position:relative;z-index:2;max-width:640px;width:100%}
